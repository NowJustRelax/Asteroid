<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Asteroid Defender</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;width:100%;height:100%;}
  canvas{display:block;position:fixed;top:0;left:0;}
  #ui{position:fixed;top:0;left:0;width:100%;pointer-events:none;
      font-family:'Segoe UI',Arial,sans-serif;color:#fff;
      text-shadow:0 0 8px rgba(0,255,255,0.8),0 0 3px #000;z-index:10;}
  .scoreRow{display:flex;justify-content:space-between;padding:16px 22px;box-sizing:border-box;}
  .scoreBlock{text-align:center;}
  .scoreLabel{font-size:13px;letter-spacing:2px;opacity:0.75;}
  .scoreValue{font-size:34px;font-weight:800;line-height:1.1;}
  #weaponIndicator{position:fixed;top:74px;left:50%;transform:translateX(-50%);
      font-size:14px;letter-spacing:1.5px;color:#0ff;text-align:center;z-index:10;
      pointer-events:none;font-family:'Segoe UI',Arial,sans-serif;
      text-shadow:0 0 6px rgba(0,255,255,0.9),0 0 2px #000;}
  #gameOverText{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      font-size:46px;font-weight:900;color:#ff3355;text-shadow:0 0 22px #ff0033,0 0 4px #000;
      opacity:0;transition:opacity 0.15s;text-align:center;z-index:20;pointer-events:none;
      font-family:'Segoe UI',Arial,sans-serif;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="scoreRow">
    <div class="scoreBlock"><div class="scoreLabel">SCORE</div><div class="scoreValue" id="scoreVal">0</div></div>
    <div class="scoreBlock"><div class="scoreLabel">HIGH SCORE</div><div class="scoreValue" id="highVal">0</div></div>
  </div>
</div>
<div id="weaponIndicator"></div>
<div id="gameOverText">GAME OVER</div>

<script>
(function(){
"use strict";

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,CX,CY;
let stars=[];
function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  CX=W/2; CY=H/2;
  makeStars();
}
resize();
window.addEventListener('resize',resize);

/* ---------------- AUDIO ---------------- */
let audioCtx=null;
function initAudio(){
  if(audioCtx) return;
  try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function resumeAudio(){ if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume().catch(()=>{}); } }
initAudio();
try{ resumeAudio(); }catch(e){}
window.addEventListener('pointerdown',()=>{ initAudio(); resumeAudio(); });
window.addEventListener('keydown',()=>{ initAudio(); resumeAudio(); });

function playShot(type){
  if(!audioCtx) return;
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  let freq=900,dur=0.08;
  if(type==='laser'){ freq=1500; dur=0.12; }
  else if(type==='shotgun'){ freq=620; dur=0.06; }
  else if(type==='fast'){ freq=1050; dur=0.05; }
  else if(type==='dual'){ freq=850; dur=0.07; }
  o.type = type==='laser' ? 'sawtooth' : 'square';
  o.frequency.setValueAtTime(freq,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(80,freq*0.35),t+dur);
  g.gain.setValueAtTime(0.15,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur+0.02);
}

function playExplosion(size){
  if(!audioCtx) return;
  const t=audioCtx.currentTime;
  const bufferSize=Math.floor(audioCtx.sampleRate*0.35);
  const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i]=(Math.random()*2-1)*Math.pow(1-i/bufferSize,2); }
  const noise=audioCtx.createBufferSource();
  noise.buffer=buffer;
  const filter=audioCtx.createBiquadFilter();
  filter.type='lowpass';
  const baseFreq= size===3?1200:size===2?1800:2400;
  filter.frequency.setValueAtTime(baseFreq,t);
  filter.frequency.exponentialRampToValueAtTime(120,t+0.3);
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(size===3?0.32:size===2?0.25:0.18,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.32);
  noise.connect(filter); filter.connect(g); g.connect(audioCtx.destination);
  noise.start(t); noise.stop(t+0.35);
}

function playPowerup(){
  if(!audioCtx) return;
  const t=audioCtx.currentTime;
  const notes=[523.25,659.25,783.99,1046.5];
  notes.forEach((f,i)=>{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type='triangle'; o.frequency.value=f;
    const start=t+i*0.07;
    g.gain.setValueAtTime(0.0001,start);
    g.gain.linearRampToValueAtTime(0.18,start+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,start+0.18);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(start); o.stop(start+0.2);
  });
}

function playGameOver(){
  if(!audioCtx) return;
  const t=audioCtx.currentTime;
  const notes=[440,349.23,293.66,220];
  notes.forEach((f,i)=>{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type='sawtooth'; o.frequency.value=f;
    const start=t+i*0.12;
    g.gain.setValueAtTime(0.001,start);
    g.gain.linearRampToValueAtTime(0.2,start+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,start+0.3);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(start); o.stop(start+0.32);
  });
}

/* ---------------- UTIL ---------------- */
function rand(a,b){ return a+Math.random()*(b-a); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function dist(x1,y1,x2,y2){ return Math.hypot(x2-x1,y2-y1); }

/* ---------------- PALETTES / BACKGROUND ---------------- */
const PALETTES=[
  {bg:['#03001a','#0a0025'],nebula:['#5b1fb5','#1f3fb5'],star:'#ffffff',accent:'#00e5ff'},
  {bg:['#050014','#12002b'],nebula:['#ff2fae','#7a1fd6'],star:'#ffe8ff',accent:'#ff3fd8'},
  {bg:['#000f14','#001a20'],nebula:['#00c2a8','#0066a8'],star:'#e0fff8',accent:'#00ffd0'},
  {bg:['#140004','#1f0007'],nebula:['#ff5a1f','#b5251f'],star:'#ffe8d8',accent:'#ff7a2f'},
  {bg:['#0a0f00','#1a2400'],nebula:['#9bd61f','#4f8f1f'],star:'#f0ffe0',accent:'#c2ff2f'}
];
let palette=choice(PALETTES);

function makeStars(){
  stars=[];
  const count=Math.floor((W*H)/6000);
  for(let i=0;i<count;i++){
    stars.push({x:rand(0,W),y:rand(0,H),r:rand(0.4,1.8),tw:rand(0,Math.PI*2),speed:rand(0.5,2)});
  }
}

let nebulaBlobs=[];
function makeNebula(){
  nebulaBlobs=[];
  for(let i=0;i<4;i++){
    nebulaBlobs.push({x:rand(0,W),y:rand(0,H),r:rand(150,380),c:choice(palette.nebula)});
  }
}

/* ---------------- GAME STATE ---------------- */
let score=0;
let highScore=parseInt(localStorage.getItem('asteroidDefenderHighScore')||'0',10);
document.getElementById('highVal').textContent=highScore;

let asteroids=[], bullets=[], particles=[], powerups=[];

let turretAngle=0;
let killsSincePowerup=0;
/* Kills needed before a power-up spawns, tied to how fast rocks are actually
   coming in (currentSpawnInterval, updated live each frame) rather than a
   flat number. That way the threshold naturally correlates to volume: slow
   early spawn rate = fewer kills needed (so the first power-up doesn't take
   forever), and the tighter spawn cadence of later rounds raises it back up
   automatically, keeping the roughly-once-every-N-seconds feel consistent. */
let currentSpawnInterval=1.1;
const POWERUP_TARGET_SECONDS=9;
function currentPowerupThreshold(){
  const rocksPerSecond=1/currentSpawnInterval;
  return Math.max(4, Math.min(35, Math.round(rocksPerSecond*POWERUP_TARGET_SECONDS)));
}
/* cap simultaneous stacked power-ups so the ship can't accumulate Shield +
   everything else and become effectively unkillable */
const MAX_ACTIVE_POWERUPS=2;

const WEAPONS={
  normal:{fireRate:0.34,name:'STANDARD'},
  fast:{fireRate:0.11,name:'RAPID FIRE'},
  shotgun:{fireRate:0.45,name:'SHOTGUN'},
  laser:{fireRate:0.5,name:'LASER'},
  dual:{fireRate:0.3,name:'DUAL CANNON'},
  shield:{name:'SHIELD'},
  multiplier:{name:'2X SCORE'}
};
const POWERUP_TYPES=['fast','shotgun','laser','dual','shield','multiplier'];
/* activeWeapons: map of type -> seconds remaining. Power-ups stack: collecting a
   new one adds/refreshes its own timer without clearing the others, so effects
   combine (e.g. shotgun + dual + laser all firing together). */
let activeWeapons={};
const WEAPON_DURATION=7;
let fireTimer=0;

let elapsed=0;
let spawnTimer=0;
const baseSpawnInterval=1.1;

/* Difficulty ramps up WITHIN a single life (via elapsed time below) but no
   longer persists across restarts — every new life starts back at baseline
   after a game over, rather than compounding across deaths. */
let roundSizeMult=1;
let roundBigBias=0;
let roundSpawnBonus=0;
/* Rocks are aimed with a travel-TIME budget rather than a flat pixel speed,
   so difficulty stays consistent across aspect ratios. A flat speed made
   rocks arrive far faster on a narrow portrait canvas (edges close to
   center) than on a wide one, making big multi-hit rocks feel disproportio-
   nately tougher on reel-format screens since there was less time to land
   enough shots before impact — this fixes that by targeting a reaction
   window instead of a speed number. */
const BASE_TIME_TO_REACH=4.2;
const MIN_TIME_TO_REACH=1.15;
function currentTimeToReach(){
  const elapsedRamp=Math.min(2.0, elapsed*0.03);
  return Math.max(MIN_TIME_TO_REACH, BASE_TIME_TO_REACH-elapsedRamp);
}

const shipRadius=22;
let shipAlive=true;
let gameOverTimer=0;
let shakeMag=0;
/* invulnerability window at the start of every life so the seeded asteroids
   can't sandwich the ship before it's fired a single shot */
let spawnGraceTimer=0;
const SPAWN_GRACE_DURATION=2.5;

const weaponIndicatorEl=document.getElementById('weaponIndicator');
const scoreValEl=document.getElementById('scoreVal');
const highValEl=document.getElementById('highVal');
const gameOverEl=document.getElementById('gameOverText');

/* ---------------- ASTEROIDS ---------------- */
function makeAsteroidPoly(radius){
  const pts=[];
  const n=Math.floor(rand(8,12));
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2;
    const r=radius*rand(0.75,1.15);
    pts.push({x:Math.cos(a)*r,y:Math.sin(a)*r});
  }
  return pts;
}
function sizeRadius(size){
  const base= size===3?46:size===2?28:16;
  return base*roundSizeMult;
}
function sizeHp(size){
  return size===3?3:size===2?2:1;
}
/* How precisely fresh asteroids aim at the ship. Early in a life they're
   aimed at a wide, wobbly area around the ship so plenty just drift past —
   as elapsed time in the current life climbs, the aim tightens toward
   dead-on. Resets to wide/wobbly again at the start of every new life. */
function currentAimOffsetRange(){
  const progress=Math.min(1, elapsed/70);
  return 260-240*progress; // 260px wobble early -> ~20px (near-direct) later
}

function spawnAsteroid(size,x,y,vx,vy){
  const radius=sizeRadius(size);
  let px,py;
  if(x===undefined){
    const edge=Math.floor(rand(0,4));
    const margin=radius+20;
    if(edge===0){ px=rand(0,W); py=-margin; }
    else if(edge===1){ px=W+margin; py=rand(0,H); }
    else if(edge===2){ px=rand(0,W); py=H+margin; }
    else { px=-margin; py=rand(0,H); }
  } else { px=x; py=y; }

  let vvx,vvy;
  if(vx===undefined){
    const offsetRange=currentAimOffsetRange();
    const targetX=CX+rand(-offsetRange,offsetRange);
    const targetY=CY+rand(-offsetRange,offsetRange);
    const dx=targetX-px, dy=targetY-py;
    const travelDist=Math.hypot(dx,dy)||1;
    const timeToReach=currentTimeToReach()*rand(0.85,1.25);
    const speed=travelDist/timeToReach;
    vvx=(dx/travelDist)*speed; vvy=(dy/travelDist)*speed;
  } else { vvx=vx; vvy=vy; }

  asteroids.push({
    x:px,y:py,vx:vvx,vy:vvy,size,radius,
    hp:sizeHp(size),
    angle:rand(0,Math.PI*2),
    spin:rand(-1.5,1.5),
    poly:makeAsteroidPoly(radius)
  });
}

function breakAsteroid(a){
  playExplosion(a.size);
  spawnParticles(a.x,a.y,a.size);
  if(a.size>1){
    for(let i=0;i<2;i++){
      const ang=rand(0,Math.PI*2);
      const speed=rand(40,90);
      spawnAsteroid(a.size-1,a.x+rand(-8,8),a.y+rand(-8,8),
        Math.cos(ang)*speed+a.vx*0.3, Math.sin(ang)*speed+a.vy*0.3);
    }
  }
  const multiplier = activeWeapons.multiplier ? 2 : 1;
  const pts= (a.size===3?15:a.size===2?25:40)*multiplier;
  score+=pts;
  scoreValEl.textContent=score;
  killsSincePowerup++;
  const activeCount=Object.keys(activeWeapons).length;
  if(killsSincePowerup>=currentPowerupThreshold() && activeCount<MAX_ACTIVE_POWERUPS){
    killsSincePowerup=0;
    spawnPowerup();
  }
  // if capped, killsSincePowerup stays at/above threshold so the very next
  // kill after a power-up expires triggers a new one right away — hits
  // earned while capped aren't lost, just held until a slot opens up
}

function spawnParticles(x,y,size){
  const n= size===3?26:size===2?18:10;
  for(let i=0;i<n;i++){
    const ang=rand(0,Math.PI*2);
    const speed=rand(40,220);
    particles.push({
      x,y,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,
      life:rand(0.3,0.7),maxLife:0.7,
      r:rand(1.5,4),color: Math.random()<0.5?palette.accent:'#ffcf6b'
    });
  }
  shakeMag=Math.min(18,shakeMag+(size===3?10:size===2?6:3));
}

function spawnPowerup(){
  const type=choice(POWERUP_TYPES);
  const edge=Math.floor(rand(0,4));
  let px,py;
  if(edge===0){ px=rand(0,W); py=-30; }
  else if(edge===1){ px=W+30; py=rand(0,H); }
  else if(edge===2){ px=rand(0,W); py=H+30; }
  else { px=-30; py=rand(0,H); }
  const ang=Math.atan2(CY-py,CX-px);
  const speed=95;
  powerups.push({x:px,y:py,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,type,pulse:0});
}

/* ---------------- BULLETS ---------------- */
/* Fire one "salvo" from a given angle, respecting whichever power-ups are
   currently stacked: shotgun widens it into a spread, laser makes every
   bullet in it piercing. Called once for the front, and again for the back
   if Dual Cannon is active, so combos compound naturally. */
function fireSalvoFrom(angle,speed){
  const laserOn=!!activeWeapons.laser;
  const angles = activeWeapons.shotgun
    ? [-2,-1,0,1,2].map(i=>angle+i*0.11)
    : [angle];
  for(const a of angles){
    if(laserOn){
      bullets.push({x:CX+Math.cos(a)*shipRadius,y:CY+Math.sin(a)*shipRadius,
        vx:Math.cos(a)*speed*1.6,vy:Math.sin(a)*speed*1.6,life:1.0,r:5,
        color:'#ff5df2',laser:true});
    } else if(activeWeapons.shotgun){
      bullets.push({x:CX+Math.cos(a)*shipRadius,y:CY+Math.sin(a)*shipRadius,
        vx:Math.cos(a)*speed*0.9,vy:Math.sin(a)*speed*0.9,life:0.9,r:3,color:'#ffcf6b'});
    } else {
      bullets.push({x:CX+Math.cos(a)*shipRadius,y:CY+Math.sin(a)*shipRadius,
        vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:1.4,r:3.5,color:palette.accent});
    }
  }
}

function fireWeapon(angle){
  const speed=520;
  // representative sound: pick whichever active power-up is "loudest" so
  // audio doesn't just play the same blip regardless of what's stacked.
  const soundType = activeWeapons.laser?'laser' : activeWeapons.shotgun?'shotgun' :
    activeWeapons.fast?'fast' : activeWeapons.dual?'dual' : 'normal';
  playShot(soundType);

  fireSalvoFrom(angle,speed);
  if(activeWeapons.dual){
    fireSalvoFrom(angle+Math.PI,speed);
  }
}

/* ---------------- GAME OVER / RESET ---------------- */
function shipHit(){
  if(!shipAlive) return;
  shipAlive=false;
  playExplosion(3);
  playGameOver();
  spawnParticles(CX,CY,3);
  spawnParticles(CX,CY,3);
  gameOverEl.style.opacity='1';
  if(score>highScore){
    highScore=score;
    localStorage.setItem('asteroidDefenderHighScore',String(highScore));
    highValEl.textContent=highScore;
  }
  gameOverTimer=1.4;
}

function resetGame(){
  palette=choice(PALETTES);
  makeNebula();
  makeStars();
  asteroids=[]; bullets=[]; particles=[]; powerups=[];
  score=0; scoreValEl.textContent='0';
  killsSincePowerup=0;
  activeWeapons={};
  elapsed=0; spawnTimer=0;
  shipAlive=true;
  gameOverEl.style.opacity='0';

  // every life starts fresh at baseline now — difficulty still ramps up
  // WITHIN a life via elapsed time, it just no longer carries over to the
  // next life after a game over
  roundSizeMult=1;
  roundBigBias=0;
  roundSpawnBonus=0;

  const seedCount=2;
  for(let i=0;i<seedCount;i++) spawnAsteroid(choice([1,1,2]));

  // brief spawn-in invulnerability so the ship isn't instantly sandwiched by
  // the seeded rocks before it's had a chance to start clearing them — this
  // is what actually gets it far enough to earn its first power-up
  spawnGraceTimer=SPAWN_GRACE_DURATION;
}

/* ---------------- MAIN LOOP ---------------- */
function nearestAsteroid(){
  let best=null,bd=Infinity;
  for(const a of asteroids){
    const d=dist(a.x,a.y,CX,CY);
    if(d<bd){ bd=d; best=a; }
  }
  return best;
}

function update(dt){
  elapsed+=dt;

  const spawnInterval=Math.max(0.24, baseSpawnInterval - roundSpawnBonus - elapsed*0.012);
  currentSpawnInterval=spawnInterval;
  spawnTimer-=dt;
  if(spawnTimer<=0){
    spawnTimer=spawnInterval;
    const roll=Math.random();
    const bigChance=Math.min(0.7,0.15+elapsed*0.01+roundBigBias);
    let size;
    if(roll<bigChance) size=3;
    else if(roll<bigChance+0.3) size=2;
    else size=1;
    spawnAsteroid(size);
    if(elapsed>25 && Math.random()<0.3) spawnAsteroid(choice([1,2,3]));
  }

  const target=nearestAsteroid();
  if(target){
    const desired=Math.atan2(target.y-CY,target.x-CX);
    let diff=desired-turretAngle;
    while(diff>Math.PI) diff-=Math.PI*2;
    while(diff<-Math.PI) diff+=Math.PI*2;
    turretAngle+=diff*Math.min(1,dt*18);
  }

  // count down each stacked power-up independently; expire on its own timer
  for(const type of Object.keys(activeWeapons)){
    activeWeapons[type]-=dt;
    if(activeWeapons[type]<=0) delete activeWeapons[type];
  }

  fireTimer-=dt;
  if(target && fireTimer<=0){
    const desired=Math.atan2(target.y-CY,target.x-CX);
    let diff=desired-turretAngle;
    while(diff>Math.PI) diff-=Math.PI*2;
    while(diff<-Math.PI) diff+=Math.PI*2;
    if(Math.abs(diff)<0.3){
      fireWeapon(turretAngle);
      // fastest active rate wins so stacking Rapid Fire always speeds things up
      const rate = activeWeapons.fast ? WEAPONS.fast.fireRate : WEAPONS.normal.fireRate;
      fireTimer=rate;
    }
  }

  for(const a of asteroids){
    a.x+=a.vx*dt; a.y+=a.vy*dt; a.angle+=a.spin*dt;
  }
  asteroids=asteroids.filter(a=> a.x>-300&&a.x<W+300&&a.y>-300&&a.y<H+300);

  for(const b of bullets){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; }
  bullets=bullets.filter(b=> b.life>0 && b.x>-50&&b.x<W+50&&b.y>-50&&b.y<H+50);

  for(const b of bullets){
    for(const a of asteroids){
      if(a._dead) continue;
      if(dist(b.x,b.y,a.x,a.y) < a.radius+b.r){
        a.hp-=1;
        if(!b.laser) b.life=0;
        if(a.hp<=0) a._dead=true;
      }
    }
  }
  for(const a of asteroids){ if(a._dead) breakAsteroid(a); }
  asteroids=asteroids.filter(a=>!a._dead);

  for(const p of powerups){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.pulse+=dt*4; }
  for(const p of powerups){
    if(dist(p.x,p.y,CX,CY) < shipRadius+18){
      p._collected=true;
      // stack: add/refresh this power-up's own timer without touching others
      activeWeapons[p.type]=WEAPON_DURATION;
      playPowerup();
    }
  }
  powerups=powerups.filter(p=>!p._collected && p.x>-60&&p.x<W+60&&p.y>-60&&p.y<H+60);

  for(const a of asteroids){
    if(dist(a.x,a.y,CX,CY) < a.radius+shipRadius*0.65){
      if(activeWeapons.shield || spawnGraceTimer>0){
        // shield/grace absorbs the hit: the rock still shatters (and still
        // scores/counts toward the next power-up) but the ship survives
        const idx=asteroids.indexOf(a);
        breakAsteroid(a);
        if(idx>-1) asteroids.splice(idx,1);
      } else {
        shipHit();
      }
      break;
    }
  }

  updateParticles(dt);
  for(const s of stars){ s.tw+=dt*s.speed; }
  shakeMag*=Math.max(0,1-dt*6);
  spawnGraceTimer=Math.max(0,spawnGraceTimer-dt);

  const activeTypes=Object.keys(activeWeapons);
  weaponIndicatorEl.textContent = activeTypes.length===0 ? '' :
    activeTypes.map(t=>WEAPONS[t].name+' '+Math.ceil(activeWeapons[t])+'s').join('  ·  ');
  scoreValEl.style.color = activeWeapons.multiplier ? '#ffd700' : '';
}

function updateParticles(dt){
  for(const p of particles){
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=0.96; p.vy*=0.96;
    p.life-=dt;
  }
  particles=particles.filter(p=>p.life>0);
}

/* ---------------- RENDER ---------------- */
function render(){
  ctx.save();
  const shx=(Math.random()-0.5)*shakeMag;
  const shy=(Math.random()-0.5)*shakeMag;
  ctx.translate(shx,shy);

  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,palette.bg[0]);
  g.addColorStop(1,palette.bg[1]);
  ctx.fillStyle=g;
  ctx.fillRect(-20,-20,W+40,H+40);

  for(const n of nebulaBlobs){
    const rg=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
    rg.addColorStop(0,n.c+'55');
    rg.addColorStop(1,n.c+'00');
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
  }

  for(const s of stars){
    const tw=0.5+0.5*Math.sin(s.tw);
    ctx.globalAlpha=0.4+0.6*tw;
    ctx.fillStyle=palette.star;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  for(const a of asteroids){
    ctx.save();
    ctx.translate(a.x,a.y);
    ctx.rotate(a.angle);
    ctx.beginPath();
    a.poly.forEach((pt,i)=>{ if(i===0) ctx.moveTo(pt.x,pt.y); else ctx.lineTo(pt.x,pt.y); });
    ctx.closePath();
    const shade= a.size===3?'#8a8a9a':a.size===2?'#a9a9ba':'#c7c7d6';
    ctx.fillStyle=shade;
    ctx.strokeStyle=palette.accent;
    ctx.lineWidth=1.5;
    ctx.globalAlpha=0.95; ctx.fill();
    ctx.globalAlpha=0.5; ctx.stroke();
    ctx.globalAlpha=1;
    ctx.restore();
  }

  for(const p of powerups){
    const pulse=1+0.15*Math.sin(p.pulse);
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.scale(pulse,pulse);
    ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fill();
    ctx.strokeStyle=palette.accent; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 14px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const label= p.type==='fast'?'F': p.type==='shotgun'?'S': p.type==='laser'?'L':
      p.type==='dual'?'D': p.type==='shield'?'H':'X';
    ctx.fillText(label,0,1);
    ctx.restore();
  }

  for(const b of bullets){
    ctx.strokeStyle=b.color;
    ctx.lineWidth=b.laser?4:2.5;
    ctx.globalAlpha=b.laser?0.85:1;
    ctx.beginPath();
    ctx.moveTo(b.x-b.vx*0.02,b.y-b.vy*0.02);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();
    ctx.globalAlpha=1;
  }

  if(shipAlive) drawShip();

  ctx.restore();
}

function shipTint(){
  if(activeWeapons.laser) return '#ff5df2';
  if(activeWeapons.shotgun) return '#ffcf6b';
  return palette.accent;
}

function drawThruster(cx,cy,scale,tint,t){
  const flick = 0.75+0.25*Math.sin(t*26)+0.15*Math.sin(t*53+1.7);
  const len = shipRadius*0.9*scale*flick;
  const w = shipRadius*0.32*scale;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const grad=ctx.createLinearGradient(cx,0,cx-len,0);
  grad.addColorStop(0, tint+'ff');
  grad.addColorStop(0.5, tint+'88');
  grad.addColorStop(1, tint+'00');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(cx, cy-w*0.5);
  ctx.lineTo(cx-len, cy);
  ctx.lineTo(cx, cy+w*0.5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawShip(){
  const t=performance.now()/1000;
  const tint=shipTint();
  const r=shipRadius;

  ctx.save();
  ctx.translate(CX,CY);
  ctx.rotate(turretAngle);

  // ambient halo so the ship pops against the starfield
  const haloR=r*2.4;
  const halo=ctx.createRadialGradient(0,0,r*0.4,0,0,haloR);
  halo.addColorStop(0,tint+'40');
  halo.addColorStop(1,tint+'00');
  ctx.fillStyle=halo;
  ctx.beginPath(); ctx.arc(0,0,haloR,0,Math.PI*2); ctx.fill();

  // main rear thruster (always on), plus a mirrored nose thruster if Dual
  // Cannon is stacked, so the rear-firing gun reads visually
  drawThruster(-r*0.5,0,1,tint,t);
  if(activeWeapons.dual) drawThruster(-r*0.95,0,0.6,tint,t+0.4);

  // hull: swept delta-wing fighter with a concave tail notch
  ctx.beginPath();
  ctx.moveTo(r*1.25,0);
  ctx.quadraticCurveTo(r*0.35,r*0.22, r*0.05,r*0.32);
  ctx.lineTo(-r*0.15,r*1.05);
  ctx.lineTo(-r*0.5,r*0.5);
  ctx.quadraticCurveTo(-r*0.62,r*0.14,-r*0.35,0);
  ctx.quadraticCurveTo(-r*0.62,-r*0.14,-r*0.5,-r*0.5);
  ctx.lineTo(-r*0.15,-r*1.05);
  ctx.lineTo(r*0.05,-r*0.32);
  ctx.quadraticCurveTo(r*0.35,-r*0.22, r*1.25,0);
  ctx.closePath();

  const hullGrad=ctx.createLinearGradient(-r,0,r*1.25,0);
  hullGrad.addColorStop(0,'#5a6b80');
  hullGrad.addColorStop(0.55,'#eef4fa');
  hullGrad.addColorStop(1,'#c7d6e6');
  ctx.fillStyle=hullGrad;
  ctx.strokeStyle=tint;
  ctx.lineWidth=2;
  ctx.shadowColor=tint;
  ctx.shadowBlur=10;
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.stroke();

  // center spine line for a bit of hull detail
  ctx.strokeStyle='rgba(0,0,0,0.18)';
  ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(r*1.05,0);
  ctx.lineTo(-r*0.25,0);
  ctx.stroke();

  // cockpit glow
  const cockpitPulse=0.8+0.2*Math.sin(t*3);
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const cg=ctx.createRadialGradient(r*0.55,0,0,r*0.55,0,r*0.24);
  cg.addColorStop(0, tint);
  cg.addColorStop(1, tint+'00');
  ctx.fillStyle=cg;
  ctx.globalAlpha=cockpitPulse;
  ctx.beginPath(); ctx.arc(r*0.55,0,r*0.24,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(r*0.55,0,r*0.1,0,Math.PI*2); ctx.fill();

  // wingtip nav lights, blinking slightly out of phase
  for(const s of [1,-1]){
    const blink=0.5+0.5*Math.sin(t*5 + (s>0?0:Math.PI));
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=0.5+0.5*blink;
    ctx.fillStyle=tint;
    ctx.beginPath();
    ctx.arc(-r*0.15,s*r*1.05,3.2,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // shield bubble: clear visual feedback that a collision won't be fatal
  if(activeWeapons.shield){
    const pulse=0.55+0.25*Math.sin(t*6);
    ctx.save();
    ctx.strokeStyle='#4dd2ff';
    ctx.lineWidth=2.5;
    ctx.globalAlpha=pulse;
    ctx.shadowColor='#4dd2ff';
    ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.arc(0,0,r*1.7,0,Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur=0;
    ctx.restore();
  }

  // spawn-grace ring: dashed white pulse, distinct from the Shield power-up,
  // shown only during the brief invulnerability window at the start of a life
  if(spawnGraceTimer>0){
    const pulse=0.5+0.3*Math.sin(t*10);
    ctx.save();
    ctx.strokeStyle='#ffffff';
    ctx.lineWidth=2;
    ctx.globalAlpha=Math.min(1,spawnGraceTimer)*pulse;
    ctx.setLineDash([6,5]);
    ctx.beginPath();
    ctx.arc(0,0,r*1.9,0,Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  ctx.restore();
}

let lastTime=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-lastTime)/1000;
  if(dt>0.05) dt=0.05;
  lastTime=now;

  if(shipAlive){
    update(dt);
  } else {
    gameOverTimer-=dt;
    updateParticles(dt);
    if(gameOverTimer<=0) resetGame();
  }
  render();
}

resetGame();
requestAnimationFrame(loop);

})();
</script>
</body>
